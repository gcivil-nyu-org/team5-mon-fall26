{% extends "routes/base.html" %}

{% block title %}Delete route{% endblock %}

{% block content %}
  <h1>Delete route?</h1>
  <p class="warning">Delete <strong>{{ route.name }}</strong> ({{ route.pickup_zone.name }} → {{ route.dropoff_zone.name }}) from My routes?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger-button">Delete route</button>
  </form>
  <p><a href="{% url 'routes:my_routes' %}">Cancel</a></p>
{% endblock %}
