{% extends "routes/base.html" %}

{% block title %}Delete day plan{% endblock %}

{% block content %}
  <h1>Delete day plan?</h1>
  <p class="warning">Delete <strong>{{ plan.name }}</strong> ({{ plan.get_day_of_week_display }}, {{ plan.stops.count }} stops) from My day plans?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger-button">Delete day plan</button>
  </form>
  <p><a href="{% url 'routes:open_day_plan' plan.pk %}">Cancel</a></p>
{% endblock %}
