{% extends "accounts/base.html" %}

{% block title %}My account{% endblock %}

{% block content %}
  <h1>My account</h1>
  <p>Signed in as <strong>{{ user.email }}</strong>.</p>
  <form method="post" action="{% url 'accounts:signout' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
